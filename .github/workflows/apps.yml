name: apps

on:
  pull_request:
  push:
    branches: [main, "fix/TIC-*", "feat/TIC-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: lint + build + test (JS/TS workspaces)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: nft_ticket_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U runner -d nft_ticket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # phiên bản lấy từ "packageManager" trong package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build trước để backend/frontend resolve được dist của @nft-ticket/shared
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://runner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/nft_ticket_test
        run: pnpm --filter backend test:db

      - name: Validate OpenAPI
        run: pnpm openapi:lint
