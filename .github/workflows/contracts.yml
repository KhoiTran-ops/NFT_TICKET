name: contracts

# Chạy trên mọi push (mọi nhánh) để nhánh làm việc có kết quả CI trước khi mở PR;
# check gắn với commit nên PR dùng lại kết quả này.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: forge fmt + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge --version
        run: forge --version

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vv

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # ABI trong packages/shared phải khớp contract hiện tại.
      - name: ABI export up to date
        run: |
          node scripts/export-abi.mjs
          if [ -n "$(git status --porcelain -- ../packages/shared/src)" ]; then
            echo "::error::ABI/addresses trong packages/shared chưa cập nhật. Chạy: pnpm --filter contracts abi:export"
            git status --porcelain -- ../packages/shared/src
            for f in ../packages/shared/src/abi/*.ts ../packages/shared/src/addresses.ts; do echo "===== $f"; cat "$f"; done
            exit 1
          fi
