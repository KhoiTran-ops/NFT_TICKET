[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Avalanche C-Chain: cần đối chiếu docs Avalanche hiện hành trước khi deploy (PIPELINE mục 5).
# Tạm dùng "shanghai" cho an toàn; đổi sau khi LEAD kiểm tra hỗ trợ Cancun trên Fuji.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.ci]
verbosity = 2
fuzz = { runs = 1000 }

[fmt]
line_length = 120
